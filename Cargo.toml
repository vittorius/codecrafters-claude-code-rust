[package]
name = "codecrafters-claude-code"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.98"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }  # async runtime
async-openai = { version = "=0.32.4", features = ["byot", "chat-completion"] }
clap = { version = "4.3.14", features = ["derive"] }                 # CLI argument parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"                                                # JSON serialization/deserialization
anyhow = "1.0.104"

[lints.rust]
elided_lifetimes_in_paths = "warn"

[lints.clippy]
unwrap_used = "deny"
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
correctness = "deny"
style = "deny"
